<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Turn your notes into study notes, flashcards, quizzes and marked practice exams. Built for school and uni students.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232346c7'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EER%3C/text%3E%3C/svg%3E">
<title>Exam Ready</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* Layout: a study web app — marketing home page, then an app shell with a left sidebar (bottom tab bar on phones); each study set opens into tool tabs. Engineering-pad grid paper, ink-blue type, highlighter yellow for what matters. */
:root{
  --paper:#f4f7fb; --grid:#e3e9f3; --sheet:#ffffff; --ink:#14223a; --ink-2:#4a5a74; --ink-3:#7d8aa1;
  --line:#d8dfea; --accent:#2346c7; --accent-ink:#ffffff; --accent-soft:#e7edff;
  --mark:#ffe45c; --mark-ink:#3b3300;
  --good:#17804a; --good-soft:#dff3e8; --warn:#b26a00; --warn-soft:#fff0d6; --bad:#c2312b; --bad-soft:#fde4e2;
  --f1:#2346c7; --f2:#17804a; --f3:#c2312b; --f4:#b26a00; --f5:#7a3fc2; --f6:#0e7f8c;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px; --side:236px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1522; --grid:#18212f; --sheet:#151d2c; --ink:#e7edf7; --ink-2:#a9b5c9; --ink-3:#7b879c;
  --line:#26324a; --accent:#7f9bff; --accent-ink:#0b1430; --accent-soft:#1c2850;
  --mark:#e9cf3f; --mark-ink:#2a2400;
  --good:#4cc78a; --good-soft:#11301f; --warn:#f0a63b; --warn-soft:#33240c; --bad:#ff7a72; --bad-soft:#3a1715;
  --f1:#7f9bff; --f2:#4cc78a; --f3:#ff7a72; --f4:#f0a63b; --f5:#b98cff; --f6:#4fc7d4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f1522; --grid:#18212f; --sheet:#151d2c; --ink:#e7edf7; --ink-2:#a9b5c9; --ink-3:#7b879c;
  --line:#26324a; --accent:#7f9bff; --accent-ink:#0b1430; --accent-soft:#1c2850;
  --mark:#e9cf3f; --mark-ink:#2a2400;
  --good:#4cc78a; --good-soft:#11301f; --warn:#f0a63b; --warn-soft:#33240c; --bad:#ff7a72; --bad-soft:#3a1715;
  --f1:#7f9bff; --f2:#4cc78a; --f3:#ff7a72; --f4:#f0a63b; --f5:#b98cff; --f6:#4fc7d4;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
body{margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,3.6vw,2.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:.875rem}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.hl{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;padding:0 .1em}

/* ---------- landing ---------- */
.site-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.site-top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.85rem;font-family:var(--f-mono);font-weight:600}
.site-links{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:56px 40px}
.hero h1{font-size:clamp(2.2rem,5.6vw,3.9rem);line-height:1.02;letter-spacing:-.035em}
.hero p.lede{font-size:1.15rem;color:var(--ink-2);max-width:52ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-demo{position:relative;min-height:440px}
.demo-card{position:absolute;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 16px 40px -24px rgba(20,34,58,.45);display:flex;flex-direction:column;gap:10px;width:min(360px,92%)}
.demo-card.c1{top:0;left:0;transform:rotate(-2.5deg)}
.demo-card.c2{top:190px;right:0;transform:rotate(2deg);width:min(300px,80%)}
.demo-card.c3{bottom:0;left:4%;transform:rotate(-.5deg);width:min(300px,80%)}
.features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-block:24px}
.feature{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px}
.feature .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-weight:600}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:h}
.howto li{list-style:none;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px;counter-increment:h}
.howto li::before{content:counter(h);width:30px;height:30px;border-radius:8px;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600}
.band{padding-block:48px;display:flex;flex-direction:column;gap:20px}
.band h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:800;letter-spacing:-.02em}
.compare{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:520px}
.compare th,.compare td{padding:12px 14px;border-top:1px solid var(--line);text-align:left}
.compare thead th{border-top:0;background:var(--paper);font-size:.85rem}
.compare td.y{color:var(--good);font-weight:700} .compare td.n{color:var(--ink-3)}
.site-foot{border-top:1px solid var(--line);background:var(--sheet);padding-block:24px;color:var(--ink-3);font-size:.85rem}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);padding-block:32px}.hero-demo{min-height:460px}.features,.howto{grid-template-columns:minmax(0,1fr)}}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--sheet);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.side .brand{padding:4px 8px 12px}
.new-btn{width:100%;justify-content:center;padding:11px 14px;margin-bottom:8px}
.side-link{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 10px;border-radius:9px;font-weight:700;color:var(--ink-2);cursor:pointer;text-align:left}
.side-link:hover{background:var(--paper);color:var(--ink)}
.side-link[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-link .ic{width:20px;text-align:center;font-family:var(--f-mono)}
.side-sec{margin-top:10px;padding:6px 10px 2px;display:flex;justify-content:space-between;align-items:center}
.fdot{width:10px;height:10px;border-radius:3px;flex:none}
.side-set{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--ink-2);cursor:pointer;text-align:left;font-size:.9rem;min-width:0}
.side-set span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side-set:hover{background:var(--paper);color:var(--ink)}
.side-set[aria-current="page"]{color:var(--ink);font-weight:700;background:var(--paper)}
.side-foot{margin-top:auto;padding:8px 10px;font-size:.78rem;color:var(--ink-3)}
.main{min-width:0;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main-in{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.tabbar{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sheet);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;font-weight:700;color:var(--ink-3);cursor:pointer;border-radius:8px}
  .tabbar button .ic{font-family:var(--f-mono);font-size:1rem}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar button.plus .ic{background:var(--accent);color:var(--accent-ink);width:34px;height:26px;border-radius:8px;display:grid;place-items:center}
}

/* ---------- shared components ---------- */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.grid-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;border:1px solid var(--line);background:var(--sheet);padding:9px 14px;font-weight:700;cursor:pointer;line-height:1.2;text-align:center;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:14px 20px;font-size:1.05rem;border-radius:11px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--accent-soft)}
.btn.danger{color:var(--bad)} .btn.small{padding:6px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:.85rem;font-weight:700;color:var(--ink-2)}
input[type=text],input[type=date],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--paper);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
button.chip{cursor:pointer}
.meter{height:8px;border-radius:99px;background:var(--grid);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter.good>i{background:var(--good)} .meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)}
.ready-big{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--sheet)}
.notice{padding:12px 14px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.busy{display:flex;gap:14px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}
.list{display:flex;flex-direction:column}
.list>.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.list>.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:2px;background:var(--grid)} .dots i.on{background:var(--good)}
.type-tag{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.type-tag.method{background:var(--mark);color:var(--mark-ink)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--paper);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.topic-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:12px;align-items:center}
.foot{color:var(--ink-3);font-size:.8rem;text-align:center}

/* dashboard */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.exam-tile{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:var(--ink)}
.exam-tile:hover{border-color:var(--accent)}
.days{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.plan li:first-child{border-top:0}
.plan .tick{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center;font-size:.8rem}
.plan li.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.plan li.done .what{text-decoration:line-through;color:var(--ink-3)}
.plan .what{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.set-card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;min-width:0;color:var(--ink);border-top:4px solid var(--fc,var(--line))}
.set-card:hover{border-color:var(--accent);border-top-color:var(--fc,var(--accent))}
.folders{display:flex;gap:8px;flex-wrap:wrap}
.folder-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);font-weight:700;cursor:pointer;color:var(--ink-2)}
.folder-btn[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

/* set page */
.set-head{display:flex;flex-direction:column;gap:14px}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tools button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);padding:9px 14px;border-radius:999px;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tools button .ic{font-family:var(--f-mono);font-size:.85rem}
.tools button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.path .stage{display:flex;flex-direction:column;gap:6px;min-width:0}
.path .stage .bar{height:8px;border-radius:99px;background:var(--grid);overflow:hidden}
.path .stage .bar i{display:block;height:100%;background:var(--good)}
.path .stage b{font-size:.82rem}
.path .stage span{font-size:.76rem;color:var(--ink-3)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.quick button{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:var(--ink)}
.quick button:hover{border-color:var(--accent)}
.quick .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-weight:600}
.quick button.go .ic{background:var(--mark);color:var(--mark-ink)}

/* study + flashcards */
.study-wrap{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:28px 24px;min-height:260px;display:flex;flex-direction:column;gap:16px;box-shadow:0 2px 0 var(--line),0 10px 30px -18px rgba(20,34,58,.35)}
.card .front{font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1.3;text-wrap:balance}
.card .back{border-top:2px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:7px;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-size:.9rem}
.steps .why{color:var(--ink-2);font-size:.92rem}
.rate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rate .btn{flex-direction:column;gap:2px;padding:14px 8px;font-size:1.02rem}
.rate .btn small{font-weight:400;color:var(--ink-3);font-size:.75rem}
.rate .no{border-color:var(--bad);color:var(--bad)} .rate .yes{border-color:var(--good);color:var(--good)}
.rate-more{display:flex;gap:8px;justify-content:center}
.explain{background:var(--accent-soft);border-radius:10px;padding:14px 16px}
.progress-line{height:4px;background:var(--grid);border-radius:4px;overflow:hidden}
.progress-line>i{display:block;height:100%;background:var(--accent)}

/* exam */
.exam-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:4;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qnav button{width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--sheet);font-family:var(--f-mono);font-weight:600;cursor:pointer;color:var(--ink)}
.qnav button.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qnav button.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qnav button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qnav button[aria-current="true"]{outline:2px solid var(--ink);outline-offset:1px}
.question{display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qtext{font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--paper)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.correct,.opt.correct:has(input:checked){border-color:var(--good);background:var(--good-soft)}
.opt.wrong,.opt.wrong:has(input:checked){border-color:var(--bad);background:var(--bad-soft)}
.photo-thumb{max-height:120px;border-radius:8px;border:1px solid var(--line)}
.solution{background:var(--paper);border-left:4px solid var(--mark);border-radius:0 8px 8px 0;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
details>summary{cursor:pointer;font-weight:700;color:var(--accent)}
.score-big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,8vw,3.6rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* tutor chat */
.chat{display:flex;flex-direction:column;gap:12px}
.bubble{max-width:85%;padding:12px 14px;border-radius:14px;min-width:0}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-input{display:flex;gap:8px;align-items:flex-end}
.chat-input textarea{min-height:48px;max-height:180px}

/* notes */
.notes-doc{max-width:70ch}
.rich{overflow-wrap:anywhere}
.rich p+p{margin-top:.6em}
.rich .li{display:flex;gap:8px;margin:.2em 0}
.rich .li>span:first-child{flex:none;font-family:var(--f-mono);color:var(--ink-3)}
.rich code{font-family:var(--f-mono);font-size:.9em;background:var(--paper);padding:1px 5px;border-radius:4px}
.rich h3.rh{font-size:1.2rem;margin:1.1em 0 .4em}
.rich h4.rh{font-size:1.02rem;margin:.9em 0 .3em}

.rich .katex-display{display:block;overflow-x:auto;margin:.5em 0;text-align:center}
.bubble.me .rich code{background:rgba(255,255,255,.18)}
math{font-size:1.1em}
@media (max-width:480px){.topic-row{grid-template-columns:minmax(0,1fr) 70px 40px}.path{grid-template-columns:repeat(2,minmax(0,1fr))}}
.login-box{max-width:440px;width:100%;margin:40px auto}
</style>
</head>
<body>

<div id="root"><div class="wrap" style="padding-block:40px"><div class="busy"><div class="spin"></div><div><b>Opening Exam Ready</b><p class="small muted">Loading your study sets.</p></div></div></div></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const DAY = 86400000;
const dkey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const today = () => dkey(new Date());
const daysUntil = iso => { if (!iso) return null; const t = new Date(iso + "T00:00:00"); const n = new Date(); n.setHours(0,0,0,0); return Math.round((t - n) / DAY); };
const fmtDate = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString(undefined, { day:"numeric", month:"short" }) : "";
const fmtWhen = ms => new Date(ms).toLocaleDateString(undefined, { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" });
const pct = x => Math.round((x || 0) * 100);
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const tone = p => p >= 75 ? "good" : p >= 50 ? "warn" : "bad";
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- maths + rich text ---------- */
function renderTex(tex, display){
  try { if (window.katex) return katex.renderToString(tex, { output:"mathml", throwOnError:false, displayMode:display }); } catch(e) {}
  return '<code>' + esc(tex) + '</code>';
}
const fmtInline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
function rich(src){
  if (src == null) return "";
  const maths = [];
  const s = String(src).replace(/\\\[([\s\S]+?)\\\]|\$\$([\s\S]+?)\$\$|\\\(([\s\S]+?)\\\)/g, (m, a, b, c) => {
    maths.push(renderTex((a ?? b ?? c).trim(), a != null || b != null));
    return "\u0000" + (maths.length - 1) + "\u0000";
  });
  let out = "", para = [];
  const flush = () => { if (para.length){ out += "<p>" + para.map(fmtInline).join("<br>") + "</p>"; para = []; } };
  for (const ln of s.split(/\n/)){
    const h = ln.match(/^\s*(#{1,4})\s+(.*)$/), m = ln.match(/^\s*(\d+)[.)]\s+(.*)$/), b = ln.match(/^\s*[-•*]\s+(.*)$/);
    if (h){ flush(); out += (h[1].length <= 2 ? '<h3 class="rh">' : '<h4 class="rh">') + fmtInline(h[2]) + (h[1].length <= 2 ? "</h3>" : "</h4>"); }
    else if (m){ flush(); out += '<div class="li"><span>' + m[1] + '.</span><span>' + fmtInline(m[2]) + '</span></div>'; }
    else if (b){ flush(); out += '<div class="li"><span>•</span><span>' + fmtInline(b[1]) + '</span></div>'; }
    else if (!ln.trim()) flush();
    else para.push(ln);
  }
  flush();
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => maths[+i]);
}
function fixTex(v){
  if (typeof v === "string") return v.replace(/\f/g, "\\f").replace(/\x08/g, "\\b").replace(/\t(?=[a-z])/g, "\\t").replace(/\r(?=[a-z])/g, "\\r");
  if (Array.isArray(v)) return v.map(fixTex);
  if (v && typeof v === "object"){ const o = {}; for (const k in v) o[k] = fixTex(v[k]); return o; }
  return v;
}

/* ---------- storage: Supabase account store, browser fallback ---------- */
const CFG = window.EXAM_READY_CONFIG || {};
const hasCloud = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase);
const sb = hasCloud ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;
const store = {
  mode: "memory", user: null,
  async init(){
    if (sb){
      this.mode = "cloud";
      const { data } = await sb.auth.getSession();
      this.user = data.session ? data.session.user : null;
      return;
    }
    try { localStorage.setItem("er_test", "1"); localStorage.removeItem("er_test"); this.mode = "local"; } catch(e) { this.mode = "memory"; }
  },
  needsLogin(){ return this.mode === "cloud" && !this.user; },
  async token(){ if (!sb) return null; const { data } = await sb.auth.getSession(); return data.session ? data.session.access_token : null; },
  async loadAll(){
    if (this.mode === "cloud"){
      if (!this.user) return [];
      const out = []; let from = 0;
      for (;;){
        const { data, error } = await sb.from("docs").select("key,data").range(from, from + 999);
        if (error) throw error;
        out.push(...data.map(r => ({ id: r.key, data: r.data })));
        if (data.length < 1000) break; from += 1000;
      }
      return out;
    }
    if (this.mode === "local"){ const out = []; try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k.startsWith("er:")) out.push({ id: k.slice(3), data: JSON.parse(localStorage.getItem(k)) }); } } catch(e) {} return out; }
    return [];
  },
  chains: {}, pending: {},
  save(key, data){
    this.pending[key] = data;
    if (this.chains[key]) return this.chains[key];
    const run = async () => {
      while (this.pending[key] !== undefined){
        const d = this.pending[key]; delete this.pending[key];
        try {
          if (this.mode === "cloud"){
            if (!this.user) continue;
            const r = d === null ? await sb.from("docs").delete().eq("key", key)
              : await sb.from("docs").upsert({ user_id: this.user.id, key, data: JSON.parse(JSON.stringify(d)), updated_at: new Date().toISOString() });
            if (r.error) throw r.error;
          }
          else if (this.mode === "local"){ if (d === null) localStorage.removeItem("er:" + key); else localStorage.setItem("er:" + key, JSON.stringify(d)); }
        } catch(e){
          toast(e && /quota|exceed/i.test(e.message || e.name || "") ? "Storage is full. Delete an old study set or exam to save more." : "Couldn't save that change. Check your connection and try again.");
        }
      }
      delete this.chains[key];
    };
    return this.chains[key] = run();
  },
  del(key){ return this.save(key, null); }
};

/* ---------- AI: calls the Worker, which holds the API key ---------- */
async function fileToImageBlock(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL("image/jpeg", 0.85).split(",")[1];
    return { type: "image", source: { type: "base64", media_type: "image/jpeg", data } };
  } catch(e){ throw { code: "image_rejected" }; } finally { URL.revokeObjectURL(url); }
}
function parseJsonLoose(text){
  const tries = [text];
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) tries.push(fence[1]);
  const a = text.search(/[\[{]/), z = Math.max(text.lastIndexOf("}"), text.lastIndexOf("]")); if (a >= 0 && z > a) tries.push(text.slice(a, z + 1));
  for (const t of tries){ try { return JSON.parse(t); } catch(e) {} }
  throw { code: "invalid_json", text };
}
function makeAI(){
  if (!CFG.AI_URL) return null;
  async function call(input, opts = {}){
    const messages = typeof input === "string" ? [{ role: "user", content: input }] : input.map(m => ({ role: m.role, content: m.content }));
    if (opts.images){
      const files = Array.from(opts.images);
      const blocks = await Promise.all(files.map(fileToImageBlock));
      const last = messages[messages.length - 1];
      last.content = [...blocks, { type: "text", text: String(last.content) }];
    }
    const token = await store.token();
    if (store.mode === "cloud" && !token) throw { code: "session_expired" };
    let res;
    try {
      res = await fetch(CFG.AI_URL, { method: "POST", signal: opts.signal, headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) },
        body: JSON.stringify({ messages, tier: opts.modelTier || "default", json: !!opts.json }) });
    } catch(e){ throw { code: e && e.name === "AbortError" ? "cancelled" : "upstream_error" }; }
    if (!res.ok){ let j = {}; try { j = await res.json(); } catch(e) {} throw { code: j.error || (res.status === 401 ? "session_expired" : res.status === 429 ? "rate_limited" : "upstream_error") }; }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "", stop = null;
    try {
      for (;;){
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n")) >= 0){
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
          if (!line.startsWith("data:")) continue;
          let ev; try { ev = JSON.parse(line.slice(5)); } catch(e) { continue; }
          if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta"){ text += ev.delta.text; if (opts.onText) opts.onText({ text, delta: ev.delta.text }); }
          else if (ev.type === "message_delta" && ev.delta) stop = ev.delta.stop_reason;
          else if (ev.type === "error") throw { code: ev.error && ev.error.type === "overloaded_error" ? "rate_limited" : "upstream_error", text };
        }
      }
    } catch(e){ if (e && e.code) throw e; throw { code: opts.signal && opts.signal.aborted ? "cancelled" : "upstream_error", text }; }
    if (stop === "refusal") throw { code: "refused" };
    if (!text.trim()) throw { code: "empty_completion" };
    return { text, truncated: stop === "max_tokens" };
  }
  const sample = (input, opts) => call(input, opts);
  sample.json = async (input, opts = {}) => { const r = await call(input, Object.assign({}, opts, { json: true })); return parseJsonLoose(r.text); };
  sample.limits = async () => ({ images: { maxCount: 5, maxInputBytes: 20 * 1024 * 1024, mediaTypes: ["image/jpeg", "image/png", "image/webp", "image/gif"] } });
  return sample;
}

/* ---------- state ---------- */
const FOLDER_COLORS = ["--f1","--f2","--f3","--f4","--f5","--f6"];
const S = {
  subjects: {}, sources: {}, exams: {}, profile: { activity: {}, folders: [], seenLanding: false },
  view: "landing", subjectId: null, tool: "overview", folderFilter: "all",
  session: null, run: null, resultId: null, chatBusy: false,
  busy: null, error: null, confirm: null, imgLimits: null, sample: null, loaded: false,
  draft: { cardsN: 20, cardsMix: "both", cardsFocus: "", examLen: "standard", examDiff: "exam", examMode: "exam", examPredict: true, examTopics: [], srcType: "notes", newFolder: "", newFolderColor: 0, pendingFiles: null }
};
const saveSubject = s => store.save("subj_" + s.id, s);
const saveProfile = () => store.save("profile", S.profile);
const folderOf = s => (S.profile.folders || []).find(f => f.id === s.folder);
const folderColor = f => f ? "var(" + FOLDER_COLORS[f.color % FOLDER_COLORS.length] + ")" : "var(--line)";
function logMinutes(min){
  if (!(min > 0)) return;
  const k = today();
  S.profile.activity[k] = Math.round(((S.profile.activity[k] || 0) + min) * 10) / 10;
  const keys = Object.keys(S.profile.activity).sort();
  if (keys.length > 120) for (const old of keys.slice(0, keys.length - 120)) delete S.profile.activity[old];
  saveProfile();
}
function streak(){ let n = 0; const d = new Date(); if (!S.profile.activity[dkey(d)]) d.setDate(d.getDate() - 1); while (S.profile.activity[dkey(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function weekMinutes(){ let t = 0; const d = new Date(); for (let i = 0; i < 7; i++){ t += S.profile.activity[dkey(d)] || 0; d.setDate(d.getDate() - 1); } return Math.round(t); }

/* ---------- spaced repetition ---------- */
const INTERVAL = [0, 1, 2, 4, 8, 16, 32];
const mastery = c => clamp((c.box || 0) / 5, 0, 1);
const isDue = c => !c.due || c.due <= Date.now();
function rateCard(c, r){
  const now = Date.now(); c.reviews = (c.reviews || 0) + 1;
  if (r === "again"){ c.box = 0; c.lapses = (c.lapses || 0) + 1; c.due = now + 60000; }
  else if (r === "hard"){ c.box = Math.max(1, c.box || 0); c.due = now + Math.max(0.5, INTERVAL[c.box] * 0.5) * DAY; }
  else if (r === "good"){ c.box = clamp((c.box || 0) + 1, 1, 6); c.due = now + INTERVAL[c.box] * DAY; }
  else { c.box = clamp((c.box || 0) + 2, 2, 6); c.due = now + INTERVAL[c.box] * DAY * 1.3; }
  c.last = now;
}

/* ---------- readiness ---------- */
const subjectExams = sid => Object.values(S.exams).filter(e => e.subjectId === sid).sort((a,b) => b.createdAt - a.createdAt);
function topicStats(s){
  const topics = new Set(s.topics || []);
  (s.cards || []).forEach(c => c.topic && topics.add(c.topic));
  const done = subjectExams(s.id).filter(e => e.submittedAt);
  done.forEach(e => Object.keys(e.topicScores || {}).forEach(t => topics.add(t)));
  const out = [];
  for (const t of topics){
    const cards = (s.cards || []).filter(c => c.topic === t);
    const cardM = cards.length ? cards.reduce((a,c) => a + mastery(c), 0) / cards.length : null;
    const ex = done.find(e => e.topicScores && e.topicScores[t] && e.topicScores[t].total > 0);
    const examM = ex ? ex.topicScores[t].got / ex.topicScores[t].total : null;
    const score = cardM != null && examM != null ? 0.4 * cardM + 0.6 * examM : (cardM ?? examM ?? 0) * 0.8;
    out.push({ topic: t, cards: cards.length, cardM, examM, score });
  }
  return out.sort((a,b) => a.score - b.score);
}
function readiness(s){ const ts = topicStats(s); return ts.length ? ts.reduce((a,t) => a + t.score, 0) / ts.length : 0; }
function grade(p, level){
  if (level === "school") return p >= 85 ? "A" : p >= 70 ? "B" : p >= 55 ? "C" : p >= 40 ? "D" : "E";
  return p >= 85 ? "7 · High Distinction" : p >= 75 ? "6 · Distinction" : p >= 65 ? "5 · Credit" : p >= 50 ? "4 · Pass" : "3 · Fail";
}

/* ---------- Claude calls ---------- */
const ERR = {
  not_granted: "Claude wasn't allowed for this page. Reload and choose Allow to use AI features.",
  rate_limited: "Too many requests right now. Wait a minute, then try again.",
  queue_overflow: "Too many requests right now. Wait a minute, then try again.",
  prompt_too_large: "Your notes are too long for one go. Remove a file or add a focus topic, then try again.",
  invalid_json: "Claude's answer came back in the wrong shape. Try again.",
  refused: "Claude declined this request. Try different notes or settings.",
  empty_completion: "Claude didn't write anything. Try asking for fewer items.",
  session_expired: "Your session expired. Reload the page and try again.",
  sampling_disabled: "AI features aren't set up yet. Add the AI_URL in config.js (see the README).",
  images_unavailable: "Photos can't be sent from this view. Type your answer instead.",
  image_rejected: "That photo couldn't be read. Try a clearer JPEG or PNG.",
  upstream_error: "Connection problem. Try again."
};
const errMsg = e => (e && ERR[e.code]) || (e && e.code === "cancelled" ? "Stopped." : "Something went wrong. Try again.");
async function ask(json, input, opts = {}){
  if (!S.sample) throw { code: "sampling_disabled" };
  const ctl = new AbortController(); if (S.busy) S.busy.ctl = ctl;
  const o = Object.assign({ signal: ctl.signal, onText: ({ text }) => { const el = $("#busy-chars"); if (el) el.textContent = text.length ? "Writing… " + text.length.toLocaleString() + " characters" : "Thinking…"; } }, opts);
  const r = json ? await S.sample.json(input, o) : await S.sample(input, o);
  return json ? fixTex(r) : r;
}
const levelWord = s => s.level === "school" ? "high school" : "university";
const MATH_RULE = 'Write ALL maths in LaTeX: inline inside \\( ... \\), display inside \\[ ... \\]. Use \\frac{a}{b} for fractions and ^{n} for powers. Never write fractions with "/" or powers with "^" outside LaTeX.';
const JSON_TEX = ' Inside JSON strings, escape every backslash (write \\\\frac and \\\\( ).';
function material(s, types, budget = 110000){
  const srcs = Object.values(S.sources).filter(x => x.subjectId === s.id && (!types || types.includes(x.type))).sort((a,b) => b.createdAt - a.createdAt);
  if (!srcs.length) return "";
  const per = Math.floor(budget / srcs.length);
  return srcs.map(x => "### " + x.type.toUpperCase().replace("_"," ") + ": " + x.title + "\n" + (x.text.length > per ? x.text.slice(0, per) + "\n[...cut for length]" : x.text)).join("\n\n");
}

/* ---------- files ---------- */
async function pdfText(file){
  if (!window.pdfjsLib) throw new Error("pdf");
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer(), isEvalSupported: false }).promise;
  const out = [];
  for (let p = 1; p <= Math.min(doc.numPages, 200); p++){
    const tc = await (await doc.getPage(p)).getTextContent();
    let line = ""; const lines = [];
    for (const it of tc.items){ line += it.str; if (it.hasEOL){ lines.push(line); line = ""; } else line += " "; }
    if (line.trim()) lines.push(line);
    out.push(lines.join("\n").replace(/[ \t]+/g, " ").trim());
  }
  return out.join("\n\n").trim();
}

async function addFiles(s, files, type){

  try {

      const text = (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) ? await pdfText(f) : await f.text();
      if (!text.trim()){ toast(f.name + " has no readable text. If it's scanned, upload photos of the pages instead."); continue; }

    }
    if (images.length){

          S.busy = { kind: "transcribe", msg: "Reading your photos (" + (i + 1) + "–" + (i + batch.length) + " of " + images.length + ")" }; render();
          const r = await ask(false, "These " + batch.length + " images are photos of study notes or textbook pages for the " + levelWord(s) + " subject \"" + s.name + "\". Transcribe all of the text into clean plain text, in reading order, keeping headings and lists. " + MATH_RULE + " Describe any diagram in one short line in square brackets. Output only the transcription.", { images: batch });
          newSource(s, type, batch.length === 1 ? batch[0].name.replace(/\.[^.]+$/, "") : "Photos " + (i + 1) + "–" + (i + batch.length), r.text); added++;
        }
      }
    }
  } catch(e){ S.error = e && e.code ? errMsg(e) : "Couldn't read that file. Try a PDF, .txt or .md file, or paste the text."; }
  S.busy = null; render();

${types}

${notes ? "COURSE MATERIAL:\n" + notes : ""}

let timerId = null;
const fmtClock = ms => { const t = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60; return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0"); };
function startExam(id){
  S.run = { id, idx: 0, started: Date.now(), answers: {}, photos: {}, reveal: {}, confirmSubmit: false };
  S.view = "exam"; render(); window.scrollTo(0, 0);
  clearInterval(timerId); timerId = setInterval(tick, 1000);
}
function tick(){
  if (S.view !== "exam" || !S.run){ clearInterval(timerId); return; }
  const ex = S.exams[S.run.id]; const el = $("#timer"); if (!el) return;
  if (ex.settings.mode !== "exam"){ el.textContent = fmtClock(Date.now() - S.run.started); return; }
  const left = ex.minutes * 60000 - (Date.now() - S.run.started);
  el.textContent = left > 0 ? fmtClock(left) : "Time's up"; el.classList.toggle("low", left < 5 * 60000);
}
const isAnswered = q => { const x = S.run.answers[q.id]; return !!((x && (x.choice != null || (x.text || "").trim())) || S.run.photos[q.id]); };
async function submitExam(){
  const ex = S.exams[S.run.id], run = S.run, s = S.subjects[ex.subjectId];
  clearInterval(timerId);
  ex.answers = run.answers; ex.timeTaken = Date.now() - run.started;
  const results = {};
  for (const q of ex.questions) if (q.type === "mcq"){ const a = run.answers[q.id]; const right = a && a.choice === q.correct; results[q.id] = { awarded: right ? q.marks : 0, feedback: a && a.choice != null ? (right ? "Correct." : "Not this one. The correct option is " + String.fromCharCode(65 + q.correct) + ".") : "Not answered." }; }
  const written = ex.questions.filter(q => q.type !== "mcq");
  const unanswered = written.filter(q => !isAnswered(q)); unanswered.forEach(q => results[q.id] = { awarded: 0, feedback: "Not answered." });
  const toMark = written.filter(q => !unanswered.includes(q));
  const textOnly = toMark.filter(q => !run.photos[q.id]), withPhoto = toMark.filter(q => run.photos[q.id]);
  if (toMark.length){ S.view = "marking"; S.busy = { kind: "mark", msg: "Marking " + toMark.length + " written answer" + (toMark.length === 1 ? "" : "s") }; render(); }
  const markPrompt = (qs, photoNote) => `You are a fair, encouraging ${levelWord(s)} examiner for "${s.name}". Mark each answer against its rubric and model answer.
Give part marks for correct working and method even when the final answer is wrong. Never give more than the question's marks. Marks may be whole or half numbers.
For each answer write "feedback" in 1-3 sentences, speaking to the student: what they got right, and exactly what was missing or wrong.
${photoNote || ""}
${MATH_RULE}${JSON_TEX}
Reply with only JSON: {"results":[{"id":"q1","awarded":3,"feedback":"..."}]}

ANSWERS TO MARK:
${JSON.stringify(qs.map(q => ({ id: q.id, question: q.question, marks: q.marks, rubric: q.rubric, model_answer: q.answer, student_answer: (run.answers[q.id] && run.answers[q.id].text) || "" })), null, 1)}`;
  const apply = (r, qs) => { for (const x of (r.results || [])){ const q = qs.find(q => q.id === x.id); if (q) results[q.id] = { awarded: clamp(Math.round((+x.awarded || 0) * 2) / 2, 0, q.marks), feedback: String(x.feedback || "") }; } };
  try {
    if (textOnly.length) apply(await ask(true, markPrompt(textOnly)), textOnly);
    for (const q of withPhoto){ S.busy.msg = "Marking your handwritten working for " + q.id.toUpperCase(); render();
      apply(await ask(true, markPrompt([q], "The attached image is the student's handwritten working for this question. Read it carefully and mark it together with any typed answer."), { images: [run.photos[q.id]] }), [q]); }
  } catch(e){ if (e && e.code !== "cancelled") S.error = errMsg(e) + " Unmarked answers show 0 for now."; }
  for (const q of toMark) if (!results[q.id]) results[q.id] = { awarded: 0, feedback: "Couldn't be marked automatically. Compare with the worked solution." };
  ex.results = results; ex.submittedAt = Date.now();
  ex.total = ex.questions.reduce((a,q) => a + q.marks, 0); ex.score = ex.questions.reduce((a,q) => a + (results[q.id] ? results[q.id].awarded : 0), 0);
  ex.photoIds = Object.keys(run.photos); ex.topicScores = {};
  for (const q of ex.questions){ const t = ex.topicScores[q.topic] || (ex.topicScores[q.topic] = { got: 0, total: 0 }); t.total += q.marks; t.got += results[q.id] ? results[q.id].awarded : 0; }
  store.save("exam_" + ex.id, ex); logMinutes(ex.timeTaken / 60000);
  S.busy = null; S.run = null; S.resultId = ex.id; S.view = "result"; render(); window.scrollTo(0, 0);
}
function mistakesToCards(exId){
  const ex = S.exams[exId], s = S.subjects[ex.subjectId]; let n = 0;

}

function planFor(){
  const items = [];
  for (const s of setsSorted()){
    const d = daysUntil(s.examDate); if (d != null && d < 0) continue;
    const cards = s.cards || []; const due = cards.filter(isDue).length;
    const reviewedToday = cards.filter(c => c.last && new Date(c.last).toDateString() === new Date().toDateString()).length;
    const srcs = sourcesOf(s).length;
    if (!srcs && !cards.length){ items.push({ html: "Upload notes for " + esc(s.name) + " to get started", act: "open-set", sid: s.id, est: 2 }); continue; }
    if (!cards.length){ items.push({ html: "Make your " + esc(s.name) + " study set", act: "open-set", sid: s.id, est: 2 }); continue; }
    items.push({ done: due === 0 && reviewedToday > 0, html: due ? "Review <b>" + due + "</b> due flashcard" + (due > 1 ? "s" : "") + " in " + esc(s.name) : "All " + esc(s.name) + " flashcards reviewed", act: due ? "study-due" : null, sid: s.id, est: Math.ceil(due * 0.5) });
    const weak = topicStats(s).find(t => t.cards && t.score < 0.7);
    if (weak) items.push({ html: "Practise your weakest topic: <span class=\"hl\">" + esc(weak.topic) + "</span> <span class=\"muted\">(" + esc(s.name) + ")</span>", act: "study-topic", sid: s.id, topic: weak.topic, est: 10 });
    const last = subjectExams(s.id).find(e => e.submittedAt && e.kind !== "quiz");
    const sinceLast = last ? (Date.now() - last.submittedAt) / DAY : 99;
    if ((d != null && d <= 21 && sinceLast > 4) || !last) items.push({ done: !!(last && new Date(last.submittedAt).toDateString() === new Date().toDateString()), html: "Sit a " + (d != null && d <= 7 ? "full" : "standard") + " practice exam for " + esc(s.name), act: "tool", tool: "exams", sid: s.id, est: d != null && d <= 7 ? 120 : 45 });
    if (items.length >= 7) break;
  }
  return items;
}

/* ---------- study / exam / results ---------- */
function vStudy(){
  const ss = S.session, s = S.subjects[ss.sid];
  if (!ss.queue.length) return '<div class="study-wrap"><section class="sheet"><span class="label">' + esc(s.name) + '</span><h1>Session done</h1><p class="muted">You went through ' + ss.total + ' card' + (ss.total > 1 ? "s" : "") + ' and knew ' + ss.known + ' straight away. Cards you didn’t know will come back sooner.</p><div class="row"><button class="btn primary" data-act="end-study">Back to ' + esc(s.name) + '</button><button class="btn" data-act="go" data-view="dashboard">Today’s plan</button></div></section></div>';
  const c = (s.cards || []).find(x => x.id === ss.queue[0]);
  if (!c){ ss.queue.shift(); return vStudy(); }
  const prog = Math.round(ss.done / (ss.done + ss.queue.length) * 100);
  const back = ss.flipped ? '<div class="back">' + (c.type === "method" && c.steps.length ? '<ol class="steps">' + c.steps.map(st => '<li><div><div class="rich">' + rich(st.do) + '</div>' + (st.why ? '<div class="why rich">' + rich(st.why) + '</div>' : "") + '</div></li>').join("") + '</ol>' : "") + (c.back ? '<div class="rich' + (c.type === "method" ? " muted small" : "") + '">' + rich(c.back) + '</div>' : "") +
    (ss.explain ? '<div class="explain"><span class="label">Explained another way</span><div class="rich" id="explain-out">' + (ss.explain.text ? rich(ss.explain.text) : "Thinking…") + '</div></div>' : (S.sample ? '<button class="btn ghost small" data-act="explain" style="align-self:flex-start">Explain it differently</button>' : "")) + '</div>' : "";
  return '<div class="study-wrap"><div class="row between"><button class="btn ghost small" data-act="end-study">← End session</button><span class="small muted">' + esc(ss.label) + ' · <span class="mono">' + (ss.done + 1) + ' / ' + (ss.done + ss.queue.length) + '</span></span></div><div class="progress-line"><i style="width:' + prog + '%"></i></div>' +
    '<article class="card"><div class="row between"><span class="type-tag ' + c.type + '">' + (c.type === "method" ? "Method · say the steps" : "Concept") + '</span><span class="small muted">' + esc(c.topic) + '</span></div><div class="front rich">' + rich(c.front) + '</div>' + back + '</article>' +
    (ss.flipped ? '<div class="rate"><button class="btn no" data-act="rate" data-r="again">Didn’t know it<small>key 1 · see it again soon</small></button><button class="btn yes" data-act="rate" data-r="good">Knew it<small>key 2 · ' + nextLabel(c, "good") + '</small></button></div><div class="rate-more"><button class="btn small ghost" data-act="rate" data-r="hard">Only just (' + nextLabel(c, "hard") + ')</button><button class="btn small ghost" data-act="rate" data-r="easy">Too easy (' + nextLabel(c, "easy") + ')</button></div>' : '<button class="btn primary big" data-act="flip">Show answer <span class="small" style="opacity:.75">(space)</span></button>') + '</div>';
}
function nextLabel(c, r){ const t = Object.assign({}, c); rateCard(t, r); const d = (t.due - Date.now()) / DAY; return d < 1 ? "back in " + Math.max(1, Math.round(d * 24)) + " h" : "back in " + Math.round(d) + " day" + (Math.round(d) === 1 ? "" : "s"); }

function vExam(){
  const run = S.run, ex = S.exams[run.id], q = ex.questions[run.idx], mode = ex.settings.mode, quiz = mode === "quiz", practice = mode === "practice";
  const a = run.answers[q.id] || {};
  const nAns = ex.questions.filter(isAnswered).length, total = ex.questions.reduce((s,q) => s + q.marks, 0);
  const shown = (practice && run.reveal[q.id]) || (quiz && a.choice != null);
  let body = '<div class="qmeta"><span class="label">Question ' + (run.idx + 1) + ' of ' + ex.questions.length + '</span>' + (quiz ? "" : '<span class="chip mono">' + q.marks + ' mark' + (q.marks > 1 ? "s" : "") + '</span>') + '<span class="chip">' + esc(q.topic) + '</span></div><div class="qtext rich">' + rich(q.question) + '</div>';
  if (q.type === "mcq"){
    body += '<div class="opts" role="radiogroup">' + q.options.map((o, i) => '<label class="opt' + (shown ? (i === q.correct ? " correct" : a.choice === i ? " wrong" : "") : "") + '"><input type="radio" name="mcq" data-act="choose" data-i="' + i + '"' + (a.choice === i ? " checked" : "") + (shown ? " disabled" : "") + '><span class="mono" style="font-weight:600">' + String.fromCharCode(65 + i) + '</span><span class="rich" style="min-width:0">' + rich(o) + '</span></label>').join("") + '</div>';
    if (quiz && shown) body += '<div class="notice ' + (a.choice === q.correct ? "" : "bad") + '" style="' + (a.choice === q.correct ? "background:var(--good-soft);color:var(--good)" : "") + '">' + (a.choice === q.correct ? "Correct!" : "Not quite. The answer is " + String.fromCharCode(65 + q.correct) + ".") + '</div>';
  } else {
    body += '<label class="field"><span>Your answer' + (q.type === "long" ? " and working" : "") + '</span><textarea id="ans-text" style="min-height:' + (q.type === "long" ? 200 : 110) + 'px" placeholder="Type your answer. For maths, plain text like 3x^2 + 1/2 is fine.">' + esc(a.text || "") + '</textarea></label>';
    if (S.imgLimits) body += '<div class="row">' + (run.photos[q.id] ? '<img class="photo-thumb" alt="Your handwritten working" src="' + URL.createObjectURL(run.photos[q.id]) + '"><button class="btn small ghost" data-act="photo-del">Remove photo</button>' : '<label class="btn small"><input type="file" id="photo-in" accept="' + S.imgLimits.mediaTypes.join(",") + '" hidden>Add photo of handwritten working</label><span class="small muted">Photos are used for marking and aren’t saved.</span>') + '</div>';
  }
  if (shown) body += '<div class="solution"><span class="label">Worked solution</span>' + (q.answer ? '<div class="rich"><b>Answer:</b> ' + rich(q.answer) + '</div>' : "") + '<div class="rich">' + rich(q.solution) + '</div></div>';
  else if (practice) body += '<button class="btn small" data-act="reveal" style="align-self:flex-start">Check answer</button>';
  const last = run.idx >= ex.questions.length - 1;
  const nav = '<div class="row between"><button class="btn" data-act="q-prev"' + (run.idx === 0 ? " disabled" : "") + '>← Previous</button>' + (!last ? '<button class="btn primary" data-act="q-next">Next →</button>' : '<button class="btn primary" data-act="submit">' + (quiz ? "See my score" : "Finish and mark") + '</button>') + '</div>';
  const confirm = run.confirmSubmit ? '<div class="notice row between"><span>' + (ex.questions.length - nAns) + ' question' + (ex.questions.length - nAns === 1 ? " is" : "s are") + ' unanswered. Submit anyway?</span><span class="row"><button class="btn small primary" data-act="submit-yes">Submit</button><button class="btn small" data-act="submit-no">Keep going</button></span></div>' : "";
  const pill = (qq, i) => { let cls = isAnswered(qq) ? "answered" : ""; if (quiz && run.answers[qq.id] && run.answers[qq.id].choice != null) cls = run.answers[qq.id].choice === qq.correct ? "right" : "wrong"; return '<button class="' + cls + '" aria-current="' + (i === run.idx) + '" data-act="q-go" data-i="' + i + '">' + (i + 1) + '</button>'; };
  return '<div class="exam-head"><div class="stack" style="gap:2px;min-width:0"><b>' + esc(ex.title) + '</b><span class="small muted">' + (quiz ? "Quiz" : total + " marks") + ' · ' + (mode === "exam" ? ex.minutes + " minutes" : quiz ? "instant feedback" : "practice mode") + ' · ' + nAns + '/' + ex.questions.length + ' answered</span></div><div class="row"><span class="timer" id="timer">' + (mode === "exam" ? fmtClock(ex.minutes * 60000) : "00:00") + '</span><button class="btn small" data-act="submit">Submit</button></div></div>' +
    '<div class="qnav" aria-label="Questions">' + ex.questions.map(pill).join("") + '</div>' + confirm + '<section class="sheet question">' + body + '</section>' + nav +
    '<button class="btn ghost small danger" data-act="quit-exam" style="align-self:flex-start">' + (S.confirm === "quit" ? "Tap again to leave without marking" : "Leave") + '</button>';
}
const vMarking = () => '<section class="sheet"><h1>Marking your exam</h1>' + busyBox() + '<p class="muted small">Multiple choice is marked instantly. Written answers get part marks for correct working.</p></section>';
function vResult(){
  const ex = S.exams[S.resultId]; if (!ex){ S.view = "dashboard"; return vDashboard(); }
  const s = S.subjects[ex.subjectId], p = pct(ex.score / ex.total), quiz = ex.kind === "quiz";
  const ts = Object.entries(ex.topicScores || {}).map(([t, v]) => ({ t, p: pct(v.got / v.total) })).sort((a,b) => a.p - b.p);
  const lost = ex.questions.filter(q => (ex.results[q.id]?.awarded ?? 0) < q.marks && !(ex.madeCards || []).includes(q.id)).length;
  const prev = subjectExams(ex.subjectId).filter(e => e.submittedAt && e.id !== ex.id && e.kind === ex.kind && e.submittedAt < ex.submittedAt)[0];
  const head = '<button class="btn ghost small" data-act="tool" data-tool="' + (quiz ? "quiz" : "exams") + '" data-sid="' + s.id + '" style="align-self:flex-start">← ' + esc(s.name) + '</button>' + errBox() +
    '<section class="sheet"><span class="label">' + esc(ex.title) + ' · ' + esc(fmtWhen(ex.submittedAt)) + '</span><div class="row" style="gap:28px;align-items:flex-end"><div><div class="score-big">' + p + '%</div><p class="mono">' + (Math.round(ex.score * 2) / 2) + ' / ' + ex.total + (quiz ? " correct" : " marks") + '</p></div>' + (quiz ? "" : '<div class="stack" style="gap:4px"><span class="label">Estimated grade</span><b style="font-family:var(--f-display);font-size:1.4rem">' + esc(grade(p, s.level)) + '</b></div>') + '<span class="small muted">Time ' + fmtClock(ex.timeTaken || 0) + (prev ? ' · last time ' + pct(prev.score / prev.total) + '% (' + (p - pct(prev.score / prev.total) >= 0 ? "+" : "") + (p - pct(prev.score / prev.total)) + ')' : "") + '</span></div>' +
    (ts.length && ts[0].p < 70 ? '<p>You lost the most marks on <span class="hl">' + esc(ts[0].t) + '</span>' + (ts[1] && ts[1].p < 70 ? ' and <span class="hl">' + esc(ts[1].t) + '</span>' : "") + '.</p>' : "") +
    '<div class="row"><button class="btn primary" data-act="mistakes" data-id="' + ex.id + '"' + (lost ? "" : " disabled") + '>Turn ' + lost + ' mistake' + (lost === 1 ? "" : "s") + ' into flashcards</button><button class="btn" data-act="retake" data-id="' + ex.id + '">Retake</button><button class="btn" data-act="tool" data-tool="' + (quiz ? "quiz" : "exams") + '" data-sid="' + s.id + '">New ' + (quiz ? "quiz" : "exam") + '</button></div></section>';
  const topics = '<section class="sheet"><h2>By topic</h2>' + ts.map(t => '<div class="topic-row"><b style="min-width:0">' + esc(t.t) + '</b>' + meter(t.p) + '<span class="mono small">' + t.p + '%</span></div>').join("") + '</section>';
  const qs = '<section class="sheet"><h2>Question by question</h2><div class="list">' + ex.questions.map((q, i) => {
    const r = ex.results[q.id] || { awarded: 0, feedback: "" }, a = ex.answers[q.id] || {};
    const full = r.awarded >= q.marks, zero = r.awarded === 0;
    const yours = q.type === "mcq" ? (a.choice != null ? String.fromCharCode(65 + a.choice) + ") " + q.options[a.choice] : "") : (a.text || "");
    return '<div class="item"><span class="chip mono ' + (full ? "good" : zero ? "bad" : "warn") + '">' + (Math.round(r.awarded * 2) / 2) + '/' + q.marks + '</span><div class="grow stack" style="gap:8px"><div class="small muted">Q' + (i + 1) + ' · ' + esc(q.topic) + '</div><div class="rich">' + rich(q.question) + '</div>' +
      '<div class="small"><span class="label">Your answer</span><div class="rich">' + (yours ? rich(yours) : '<span class="muted">' + ((ex.photoIds || []).includes(q.id) ? "Handwritten working (photo)" : "No answer") + '</span>') + '</div></div>' +
      (r.feedback ? '<div class="small rich">' + rich(r.feedback) + '</div>' : "") +
      '<details><summary>Worked solution</summary><div class="solution" style="margin-top:8px">' + (q.answer ? '<div class="rich"><b>Answer:</b> ' + rich(q.answer) + '</div>' : "") + '<div class="rich">' + rich(q.solution) + '</div></div></details></div></div>';
  }).join("") + '</div></section>';
  return head + '<div class="grid2"><div class="stack" style="gap:20px">' + qs + '</div><div class="stack" style="gap:20px">' + topics + '</div></div>';
}

function vProgress(){
  const sets = setsSorted();
  if (!sets.length) return '<h1>Progress</h1><div class="empty"><p class="muted">Make a study set to start tracking your readiness.</p><button class="btn primary" data-act="new-set">+ New study set</button></div>';
  const days = []; const d = new Date(); d.setDate(d.getDate() - 27);
  for (let i = 0; i < 28; i++){ days.push({ k: dkey(d), m: S.profile.activity[dkey(d)] || 0, day: d.getDate() }); d.setDate(d.getDate() + 1); }
  const maxM = Math.max(30, ...days.map(x => x.m)), W = 560, H = 140, bw = W / 28;
  const chart = '<div style="overflow-x:auto"><svg viewBox="0 0 ' + W + ' ' + (H + 22) + '" width="100%" style="min-width:420px;display:block" role="img" aria-label="Minutes studied per day, last 28 days">' +
    [0, 0.5, 1].map(f => '<line x1="0" x2="' + W + '" y1="' + (H - f * (H - 10)) + '" y2="' + (H - f * (H - 10)) + '" stroke="var(--grid)"/>' + (f ? '<text x="' + (W - 2) + '" y="' + (H - f * (H - 10) - 3) + '" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="JetBrains Mono, monospace">' + Math.round(maxM * f) + ' min</text>' : "")).join("") +
    days.map((x, i) => { const h = x.m / maxM * (H - 10); return '<rect x="' + (i * bw + 2) + '" y="' + (H - h) + '" width="' + (bw - 4) + '" height="' + Math.max(h, x.m ? 2 : 0) + '" rx="2" fill="' + (i === 27 ? "var(--accent)" : "var(--ink-3)") + '" opacity="' + (i === 27 ? 1 : 0.55) + '"><title>' + x.k + ': ' + Math.round(x.m) + ' min</title></rect>' + (i % 7 === 6 || i === 0 ? '<text x="' + (i * bw + bw / 2) + '" y="' + (H + 15) + '" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="JetBrains Mono, monospace">' + x.day + '</text>' : ""); }).join("") + '</svg></div>';
  return '<h1>Progress</h1><section class="sheet"><div class="row between"><h2>Study time, last 4 weeks</h2><span class="small muted">' + streak() + '-day streak · ' + weekMinutes() + ' min this week</span></div>' + chart + '</section>' +
    '<div class="grid-sets" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">' + sets.map(s => {
      const r = pct(readiness(s)), ts = topicStats(s).sort((a,b) => a.topic.localeCompare(b.topic)), ex = subjectExams(s.id).filter(e => e.submittedAt && e.kind !== "quiz").slice(0, 5).reverse();
      return '<section class="sheet"><div class="row between"><h3>' + esc(s.name) + '</h3><span class="chip ' + tone(r) + '">' + r + '% ready</span></div>' + meter(r) +
        (ts.length ? '<div class="stack" style="gap:8px">' + ts.map(t => '<div class="topic-row" style="grid-template-columns:minmax(0,1fr) 90px 40px"><span class="small" style="min-width:0">' + esc(t.topic) + '</span>' + meter(pct(t.score)) + '<span class="mono small">' + pct(t.score) + '%</span></div>').join("") + '</div>' : '<p class="small muted">No topics yet.</p>') +
        (ex.length ? '<div class="stack" style="gap:6px"><span class="label">Exam scores</span><div class="row" style="gap:6px">' + ex.map(e => '<button class="chip mono ' + tone(pct(e.score / e.total)) + '" data-act="view-result" data-id="' + e.id + '">' + pct(e.score / e.total) + '%</button>').join('<span class="muted">→</span>') + '</div></div>' : "") +
        '<button class="btn small" data-act="open-set" data-sid="' + s.id + '" style="align-self:flex-start">Open study set</button></section>';
    }).join("") + '</div>';
}
