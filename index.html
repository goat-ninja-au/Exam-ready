/* ---------- render ---------- */
function render(){
  if (!S.loaded) return;
  const root = $("#root");
  if (S.view === "landing"){ root.innerHTML = vLanding(); return; }
  if (S.view === "login"){ root.innerHTML = vLogin(); return; }
  const views = { dashboard: vDashboard, library: vLibrary, newset: vNewSet, set: vSet, study: vStudy, exam: vExam, marking: vMarking, result: vResult, progress: vProgress };
  root.innerHTML = shell((views[S.view] || vDashboard)());
  if (S.view === "exam") tick();
}

/* ---------- events ---------- */
const curQ = () => S.exams[S.run.id].questions[S.run.idx];
function updateExamChrome(){
  const ex = S.exams[S.run.id];
  document.querySelectorAll(".qnav button").forEach((btn, i) => btn.classList.toggle("answered", isAnswered(ex.questions[i])));
}
function leaveGuard(){ if (S.view === "exam"){ S.confirm = "quit"; render(); return true; } if (S.view === "study") { logMinutes((Date.now() - S.session.started) / 60000); S.session = null; } return false; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, sid = b.dataset.sid;
  if (b.tagName === "INPUT" && act !== "choose") return;
  if (act !== "quit-exam" && S.confirm === "quit") S.confirm = null;
  switch (act){
    case "landing": if (leaveGuard()) return; S.view = "landing"; render(); window.scrollTo(0,0); break;
    case "enter": enterApp("dashboard"); break;
    case "go": if (leaveGuard()) return; enterApp(b.dataset.view); break;
    case "new-set": if (leaveGuard()) return; S.draft.pendingFiles = null; enterApp("newset"); break;
    case "example": loadExample(); break;
    case "open-set": if (leaveGuard()) return; enterApp("set", sid); break;
    case "tool": if (leaveGuard()) return; S.subjectId = sid || S.subjectId; S.tool = b.dataset.tool; S.view = "set"; S.error = null; S.confirm = null; render(); if (S.tool === "tutor") scrollChat(); break;
    case "clear-err": S.error = null; render(); break;
    case "stop": if (S.busy && S.busy.ctl) S.busy.ctl.abort(); break;
    case "confirm-cancel": S.confirm = null; render(); break;
    case "ffilter": S.folderFilter = b.dataset.f; S.confirm = null; render(); break;
    case "nf-color": S.draft.newFolderColor = +b.dataset.i; { const nm = $("#nf-name") && $("#nf-name").value; render(); const det = document.querySelector("#new-folder"); if (det) { det.closest("details").open = true; $("#nf-name").value = nm || ""; } } break;
    case "del-folder": S.confirm = "del-folder"; render(); break;
    case "del-folder-yes": { const fid = S.folderFilter; S.profile.folders = (S.profile.folders || []).filter(f => f.id !== fid); Object.values(S.subjects).forEach(s => { if (s.folder === fid){ s.folder = null; saveSubject(s); } }); saveProfile(); S.folderFilter = "all"; S.confirm = null; render(); break; }
    case "del-set": S.confirm = "del-set"; render(); break;
    case "del-set-yes": {
      const s = S.subjects[S.subjectId];
      sourcesOf(s).forEach(x => { delete S.sources[x.id]; store.del("src_" + x.id); });
      subjectExams(s.id).forEach(x => { delete S.exams[x.id]; store.del("exam_" + x.id); });
      delete S.subjects[s.id]; store.del("subj_" + s.id); S.confirm = null; S.subjectId = null; S.view = "library"; render(); toast("Study set deleted"); break; }
    case "src-type": S.draft.srcType = b.dataset.type; { const keep = captureNewSet(); render(); restoreNewSet(keep); } break;
    case "paste-add": { const t = $("#paste-text").value.trim(); if (!t){ toast("Paste some text first"); return; } newSource(S.subjects[S.subjectId], S.draft.srcType, $("#paste-title").value.trim() || "Pasted notes", t); render(); toast("Text added"); break; }
    case "del-src": S.confirm = "src-" + b.dataset.id; render(); break;
    case "del-src-yes": delete S.sources[b.dataset.id]; store.del("src_" + b.dataset.id); S.confirm = null; render(); break;
    case "make-all": makeEverything(S.subjects[sid]); break;
    case "gen-notes": generateNotes(S.subjects[sid], false); break;
    case "cards-n": S.draft.cardsN = +b.dataset.n; render(); reopen("Make more"); break;
    case "cards-mix": S.draft.cardsMix = b.dataset.mix; render(); reopen("Make more"); break;
    case "gen-cards": generateCards(S.subjects[sid], false).then(ok => { if (ok){ S.tool = "flashcards"; render(); } }); break;
    case "del-card": { const s = S.subjects[S.subjectId]; s.cards = s.cards.filter(c => c.id !== b.dataset.id); saveSubject(s); render(); break; }
    case "study-due": { const s = S.subjects[sid]; if ((s.cards || []).some(isDue)) startStudy(sid, { due: true }); else startStudy(sid, null); break; }
    case "study-all": startStudy(sid, null); break;
    case "study-topic": startStudy(sid, { topic: b.dataset.topic }); break;
    case "flip": S.session.flipped = true; render(); break;
    case "rate": doRate(b.dataset.r); break;
    case "end-study": endStudy(); break;
    case "explain": explainCard(); break;
    case "ex-len": S.draft.examLen = b.dataset.v; render(); break;
    case "ex-diff": S.draft.examDiff = b.dataset.v; render(); break;
    case "ex-mode": S.draft.examMode = b.dataset.v; render(); break;
    case "ex-topic-all": S.draft.examTopics = []; render(); break;
    case "ex-topic": { const t = b.dataset.topic, a = S.draft.examTopics; S.draft.examTopics = a.includes(t) ? a.filter(x => x !== t) : a.concat(t); render(); break; }
    case "gen-exam": generateExam(S.subjects[sid], false); break;
    case "gen-quiz": generateExam(S.subjects[sid], true); break;
    case "start-exam": startExam(b.dataset.id); break;
    case "retake": {
      const old = S.exams[b.dataset.id];
      const ex = Object.assign(JSON.parse(JSON.stringify(old)), { id: uid(), createdAt: Date.now(), answers: {}, results: {}, submittedAt: null, score: null, topicScores: null, madeCards: [], photoIds: [], title: old.title.replace(/ \(retake\)$/, "") + " (retake)" });
      S.exams[ex.id] = ex; store.save("exam_" + ex.id, ex); startExam(ex.id); break; }
    case "view-result": S.resultId = b.dataset.id; S.view = "result"; render(); window.scrollTo(0,0); break;
    case "mistakes": mistakesToCards(b.dataset.id); break;
    case "choose": {
      const q = curQ(), ex = S.exams[S.run.id];
      S.run.answers[q.id] = Object.assign({}, S.run.answers[q.id], { choice: +b.dataset.i });
      if (ex.settings.mode === "quiz") render(); else updateExamChrome(); return; }
    case "q-prev": S.run.idx--; S.run.confirmSubmit = false; render(); break;
    case "q-next": S.run.idx++; render(); break;
    case "q-go": S.run.idx = +b.dataset.i; render(); break;
    case "reveal": S.run.reveal[curQ().id] = true; render(); break;
    case "photo-del": delete S.run.photos[curQ().id]; render(); break;
    case "submit": { const ex = S.exams[S.run.id]; if (ex.questions.some(q => !isAnswered(q))){ S.run.confirmSubmit = true; render(); window.scrollTo(0,0); } else submitExam(); break; }
    case "submit-yes": submitExam(); break;
    case "submit-no": S.run.confirmSubmit = false; render(); break;
    case "quit-exam": if (S.confirm === "quit"){ clearInterval(timerId); S.confirm = null; const ex = S.exams[S.run.id]; S.run = null; S.subjectId = ex.subjectId; S.view = "set"; S.tool = ex.kind === "quiz" ? "quiz" : "exams"; render(); } else { S.confirm = "quit"; render(); } break;
    case "chat-suggest": sendChat(b.dataset.q); break;
    case "login-again": S.loginSent = null; render(); break;
    case "signout": sb.auth.signOut().then(() => location.reload()); break;
    case "chat-clear": { const s = S.subjects[S.subjectId]; s.chat = []; saveSubject(s); render(); break; }
  }
});
function reopen(prefix){ document.querySelectorAll("details").forEach(d => { const sm = d.querySelector("summary"); if (sm && sm.textContent.startsWith(prefix)) d.open = true; }); }
function captureNewSet(){ if (S.view !== "newset") return null; const g = id => { const el = $(id); return el ? (el.type === "checkbox" ? el.checked : el.value) : null; }; return { name: g("#ns-name"), level: g("#ns-level"), date: g("#ns-date"), folder: g("#ns-folder"), paste: g("#ns-paste"), auto: g("#ns-auto") }; }
function restoreNewSet(k){ if (!k) return; const s = (id, v) => { const el = $(id); if (el && v != null){ if (el.type === "checkbox") el.checked = v; else el.value = v; } }; s("#ns-name", k.name); s("#ns-level", k.level); s("#ns-date", k.date); s("#ns-folder", k.folder); s("#ns-paste", k.paste); s("#ns-auto", k.auto); }

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "cards-focus") S.draft.cardsFocus = t.value;
  else if (t.id === "ans-text" && S.run){ const q = curQ(); S.run.answers[q.id] = Object.assign({}, S.run.answers[q.id], { text: t.value }); updateExamChrome(); }
  else if (t.id === "chat-text"){ t.style.height = "auto"; t.style.height = Math.min(180, t.scrollHeight) + "px"; }
});
document.addEventListener("change", e => {
  const t = e.target, s = S.subjects[S.subjectId];
  if (t.id === "file-in") addFiles(s, Array.from(t.files || []), S.draft.srcType);
  else if (t.id === "ns-files"){ S.draft.pendingFiles = Array.from(t.files || []); const n = $("#ns-files-n"); if (n) n.textContent = S.draft.pendingFiles.length + " file" + (S.draft.pendingFiles.length === 1 ? "" : "s") + " chosen"; }
  else if (t.id === "photo-in" && t.files && t.files[0] && S.run){ const f = t.files[0]; if (S.imgLimits && f.size > S.imgLimits.maxInputBytes){ toast("That photo is too large. Try a smaller one."); return; } S.run.photos[curQ().id] = f; render(); }
  else if (t.id === "ex-predict") S.draft.examPredict = t.checked;
  else if (t.id === "set-date"){ s.examDate = t.value || null; saveSubject(s); render(); }
  else if (t.id === "set-name"){ const v = t.value.trim(); if (v){ s.name = v.slice(0, 80); saveSubject(s); render(); } }
  else if (t.id === "set-folder"){ s.folder = t.value || null; saveSubject(s); render(); reopen("Set details"); }
  else if (t.id === "set-level"){ s.level = t.value; saveSubject(s); render(); reopen("Set details"); }
});
document.addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();
  if (f.id === "login-form"){
    const email = $("#login-email").value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ S.error = "Enter a valid email address."; render(); return; }
    S.loginBusy = true; S.error = null; render();
    try { localStorage.setItem("er_after_login", JSON.stringify(S.afterLogin || {})); } catch(e) {}
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    S.loginBusy = false;
    if (error) S.error = /rate/i.test(error.message) ? "Too many sign-in emails. Wait a minute, then try again." : "Couldn't send the email: " + error.message;
    else S.loginSent = email;
    render(); return;
  }
  if (f.id === "new-folder"){
    const name = $("#nf-name").value.trim(); if (!name) return;
    const folder = { id: uid(), name: name.slice(0, 40), color: S.draft.newFolderColor };
    S.profile.folders = (S.profile.folders || []).concat(folder); saveProfile(); S.folderFilter = folder.id; render(); toast("Folder added");
  } else if (f.id === "new-set"){
    const name = $("#ns-name").value.trim(); if (!name) return;
    const s = { id: uid(), name: name.slice(0, 80), level: $("#ns-level").value, examDate: $("#ns-date").value || null, folder: ($("#ns-folder") && $("#ns-folder").value) || null, createdAt: Date.now(), topics: [], cards: [] };
    const paste = $("#ns-paste").value.trim(), auto = $("#ns-auto").checked, files = S.draft.pendingFiles || [];
    S.subjects[s.id] = s; saveSubject(s);
    if (paste) newSource(s, S.draft.srcType, "Pasted notes", paste);
    S.subjectId = s.id; S.view = "set"; S.tool = "overview"; S.draft.pendingFiles = null;
    if (files.length) await addFiles(s, files, S.draft.srcType); else render();
    if (auto && sourcesOf(s).length && S.sample) await makeEverything(s);
    else if (!sourcesOf(s).length){ S.tool = "sources"; render(); }
  } else if (f.id === "chat-form"){
    const t = $("#chat-text"); const v = t.value; t.value = ""; sendChat(v);
  }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "chat-text" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#chat-form").requestSubmit(); return; }
  if (S.view !== "study" || !S.session || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.code === "Space" && !S.session.flipped){ e.preventDefault(); S.session.flipped = true; render(); }
  else if (S.session.flipped && (e.key === "1" || e.key === "2")) doRate(e.key === "1" ? "again" : "good");
});
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => {
  const d = e.target.closest && e.target.closest("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("over");
  const files = Array.from(e.dataTransfer.files || []);
  if (S.view === "newset"){ S.draft.pendingFiles = files; const n = $("#ns-files-n"); if (n) n.textContent = files.length + " file" + (files.length === 1 ? "" : "s") + " chosen"; }
  else addFiles(S.subjects[S.subjectId], files, S.draft.srcType);
});

/* ---------- boot ---------- */
async function loadData(){
  S.subjects = {}; S.sources = {}; S.exams = {}; S.profile = { activity: {}, folders: [], seenLanding: false };
  try {
    for (const { id, data } of await store.loadAll()){
      if (!data) continue;
      if (id.startsWith("subj_")) S.subjects[data.id] = data;
      else if (id.startsWith("src_")) S.sources[data.id] = data;
      else if (id.startsWith("exam_")) S.exams[data.id] = data;
      else if (id === "profile") S.profile = Object.assign({ activity: {}, folders: [] }, data);
    }
  } catch(e){ S.error = "Couldn't load your saved work. Reload the page to try again."; }
}
async function boot(){
  await store.init();
  await loadData();
  S.sample = makeAI();
  if (S.sample) S.imgLimits = (await S.sample.limits()).images;
  if (!store.needsLogin() && (Object.keys(S.subjects).length || S.profile.seenLanding)) S.view = "dashboard";
  if (sb){
    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === "SIGNED_IN" && session && (!store.user || store.user.id !== session.user.id)){
        store.user = session.user; await loadData();
        let after = {}; try { after = JSON.parse(localStorage.getItem("er_after_login") || "{}"); localStorage.removeItem("er_after_login"); } catch(e) {}
        if (after.example && !Object.keys(S.subjects).length) loadExample();
        else enterApp(Object.keys(S.subjects).length ? "dashboard" : (after.view || "newset"), after.sid);
      } else if (event === "SIGNED_OUT"){ store.user = null; S.view = "landing"; render(); }
    });
  }
  S.loaded = true; render();
}
boot();
})();
</script>
